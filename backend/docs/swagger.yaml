definitions:
  internal_api_admin.CreateUserRequest:
    properties:
      allow_nesting:
        type: boolean
      cpu_allowance:
        type: integer
      cpu_quota:
        type: integer
      disk_quota:
        type: integer
      egress:
        type: integer
      ingress:
        type: integer
      io_read:
        type: integer
      io_write:
        type: integer
      ipv4_mapping_limit:
        type: integer
      ipv4_pool_limit:
        type: integer
      ipv6_mapping_limit:
        type: integer
      ipv6_pool_limit:
        type: integer
      max_cpu_per_container:
        type: integer
      memory_quota:
        type: integer
      memory_swap:
        type: boolean
      processes_limit:
        type: integer
      reverse_proxy_limit:
        type: integer
      traffic_limit:
        type: integer
      username:
        type: string
    required:
    - username
    type: object
  internal_api_admin.UpdateUserRequest:
    properties:
      allow_nesting:
        type: boolean
      cpu_allowance:
        type: integer
      cpu_quota:
        type: integer
      disk_quota:
        type: integer
      egress:
        type: integer
      ingress:
        type: integer
      io_read:
        type: integer
      io_write:
        type: integer
      ipv4_mapping_limit:
        type: integer
      ipv4_pool_limit:
        type: integer
      ipv6_mapping_limit:
        type: integer
      ipv6_pool_limit:
        type: integer
      max_cpu_per_container:
        type: integer
      memory_quota:
        type: integer
      memory_swap:
        type: boolean
      processes_limit:
        type: integer
      reverse_proxy_limit:
        type: integer
      status:
