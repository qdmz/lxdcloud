  internal_api_user.UserCreateContainerRequest:
    properties:
      cpu:
        type: integer
      disk:
        type: integer
      image:
        type: string
      ipv4_mapping_limit:
        type: integer
      ipv4_pool_limit:
        type: integer
      ipv6_mapping_limit:
        type: integer
      ipv6_pool_limit:
        type: integer
      memory:
        type: integer
      name:
        type: string
      password:
        type: string
      reverse_proxy_limit:
        type: integer
      traffic_limit:
        type: integer
