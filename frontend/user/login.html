<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>用户登录 - LXD Panel</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/style.css?v=1.1.3">
  <meta name="theme-color" content="#070b14">
  <script src="../js/theme.js?v=1.1.3"></script>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-logo" id="brandLogo">L</div>
        <h1 id="brandName">LXD 容器面板</h1>
        <p>登录用户中心管理我的容器</p>
      </div>

      <div id="errorMsg" class="login-error hidden"></div>

      <form id="loginForm" style="display:flex;flex-direction:column;gap:16px">
        <div class="field">
          <label>用户名</label>
          <input class="input" name="username" type="text" placeholder="请输入用户名" autocomplete="username" spellcheck="false" required>
        </div>

        <div class="field">
          <label>密码</label>
          <input class="input" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
        </div>

        <div class="field">
          <label>验证码</label>
          <div class="captcha-row">
            <input class="input" name="captcha" type="text" placeholder="输入验证码" autocomplete="off" maxlength="6">
            <img class="captcha-img" id="captchaImg" alt="验证码" title="点击刷新验证码">
          </div>
        </div>

        <button class="btn btn-primary btn-block" type="submit" style="margin-top:4px">登 录</button>
      </form>

      <div class="login-tip">
        <span style="flex-shrink:0">ℹ</span>
        <span>未注册用户请先 <a href="register.html" style="color:var(--accent)">注册账号</a>；忘记密码可 <a href="forgot.html" style="color:var(--accent)">邮箱找回</a>。</span>
      </div>

      <p class="footer" id="footerText" style="margin-top:18px;padding:0"></p>
    </div>
  </div>

  <script src="../js/app.js?v=1.1.3"></script>
  <script src="../js/user-login.js?v=1.1.3"></script>
</body>
</html>
