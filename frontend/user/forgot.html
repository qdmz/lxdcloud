<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>找回密码 - LXD Panel</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/style.css?v=1.1.5">
  <meta name="theme-color" content="#070b14">
  <script src="../js/theme.js?v=1.1.5"></script>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-logo" id="brandLogo">L</div>
        <h1 id="brandName">LXD 容器面板</h1>
        <p>通过注册邮箱找回密码</p>
      </div>
      <div id="errorMsg" class="login-error hidden"></div>
      <form id="forgotForm" style="display:flex;flex-direction:column;gap:16px">
        <div class="field"><label>注册邮箱</label>
          <input class="input" name="email" type="email" placeholder="请输入注册邮箱" autocomplete="email" required></div>
        <button class="btn btn-primary btn-block" type="submit">发送重置邮件</button>
      </form>
      <div class="login-tip"><span style="flex-shrink:0">ℹ</span>
        <span>邮件将包含重置链接，点击后在页面输入新密码完成重置。</span></div>
      <p class="footer" style="margin-top:14px;padding:0"><a href="login.html" style="color:var(--accent)">返回登录</a></p>
    </div>
  </div>
  <script src="../js/app.js?v=1.1.5"></script>
  <script src="../js/user-forgot.js?v=1.1.5"></script>
</body>
</html>
