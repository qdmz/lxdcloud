name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要编译并挂附件的 tag（如 v1.1.21）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Build binaries
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../lxdapi-linux-amd64 ./cmd/lxdapi/
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o ../lxdapi-linux-arm64 ./cmd/lxdapi/
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            lxdapi-linux-amd64
            lxdapi-linux-arm64
